---
# Tasks to deploy a single gateway user (e.g. 'noc' or 'sre')

# Use password: '*' to create an invalid password hash (disabling password auth)
# BUT set password_lock: no to avoid the '!' prefix which triggers PAM denials.
# Use /bin/bash (or valid shell) because sshd needs to spawn a shell to run the forced command.
- name: "Ensure gateway user '{{ gateway_user }}' exists"
  ansible.builtin.user:
    name: "{{ gateway_user }}"
    shell: /bin/bash
    create_home: yes
    state: present
    password: '*'
    password_lock: no

# --- Bin Directory & Permissions ---

- name: "Ensure gateway home {{ gateway_user }} is group traverseable"
  ansible.builtin.file:
    path: "/home/{{ gateway_user }}"
    state: directory
    mode: '0750'

- name: "Ensure {{ gateway_user }} bin directory exists"
  ansible.builtin.file:
    path: "/home/{{ gateway_user }}/bin"
    state: directory
    # Owned by root to satisfy the secure path check in ssh-handoff
    owner: root
    group: "{{ gateway_user }}"
    mode: '0750'

# --- Authorized Keys Management ---

- name: "Find local key files for {{ gateway_user }}"
  ansible.builtin.find:
    paths: "{{ key_source_root }}/{{ gateway_user }}"
    patterns: "*.keys"
    file_type: file
  register: gateway_key_files
  delegate_to: localhost
  become: no

- name: "Generate authorized_keys for {{ gateway_user }}"
  ansible.builtin.template:
    src: ../templates/authorized_keys.j2
    dest: "{{ target_auth_dir }}/{{ gateway_user }}"
    owner: root
    group: root
    mode: '0644'
  vars:
    user_key_files: "{{ gateway_key_files.files }}"

# --- Sudo Access ---

- name: "Allow {{ gateway_user }} to run handoff script via sudo"
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/99-ssh-handoff-{{ gateway_user }}"
    content: "{{ gateway_user }}    ALL=(root)    NOPASSWD: {{ handoff_script_path }}"
    mode: '0440'
    validate: 'visudo -cf %s'

# --- SSH Modular Config ---

- name: "Deploy sshd config drop-in for {{ gateway_user }}"
  ansible.builtin.template:
    src: ../templates/gateway_sshd.conf.j2
    dest: "/etc/ssh/sshd_config.d/gateway-{{ gateway_user }}.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Restart SSH

# --- User Cleanup Logic ---

- name: "Get all system users"
  ansible.builtin.getent:
    database: passwd

- name: "Identify stale {{ gateway_user }} accounts"
  set_fact:
    stale_users: >-
      {{
        ansible_facts.getent_passwd.keys()
        | select('match', '^' + gateway_user + '-')
        | difference(
            gateway_key_files.files
            | map(attribute='path')
            | map('basename')
            | map('splitext')
            | map('first')
            | map('regex_replace', '^', gateway_user + '-')
            | list
          )
      }}

- name: "Remove stale users for gateway {{ gateway_user }}"
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: yes
    force: yes
  loop: "{{ stale_users }}"
