---
- name: Manage SSH Handoff Gateways
  hosts: all
  become: yes
  
  vars:
    gateways:
      - noc
      - sre
    
    key_source_root: "./public_keys"
    target_auth_dir: "/etc/ssh/authorized_keys.d"
    # Must match ENV_DIR in files/ssh-handoff.sh
    handoff_env_dir: "/etc/ssh-handoff"
    handoff_script_path: "/usr/local/bin/ssh-handoff.sh"
    # Must match MIN_ID / MAX_ID in files/ssh-handoff.sh
    handoff_uid_min: 2000
    handoff_uid_max: 5000
    sshd_service_name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
    # ssh_options REMOVED - configured in sshd_config match blocks

    # Optional team-wide variables, exported via <handoff_env_dir>/<gateway>.sh
    gateway_env_vars: {}
    #   noc:
    #     TEAM: noc
    #     EDITOR: vim

  tasks:
    # --- Global Setup ---
    
    - name: "Ensure secure authorized_keys directory exists"
      ansible.builtin.file:
        path: "{{ target_auth_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "Ensure shared environment directory exists"
      ansible.builtin.file:
        path: "{{ handoff_env_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "Deploy the HARDENED handoff script"
      ansible.builtin.copy:
        src: ./files/ssh-handoff.sh
        dest: "{{ handoff_script_path }}"
        owner: root
        group: root
        mode: '0700'

    - name: "Configure global sudoers defaults for ssh-handoff"
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/00-ssh-handoff-common"
        content: 'Defaults env_keep += "SSH_USER_AUTH"'
        mode: '0440'
        validate: 'visudo -cf %s'

    # --- SSH Config Modularization ---
    
    - name: "Ensure sshd_config.d directory exists"
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        mode: '0755'

    - name: "Ensure sshd_config includes .d directory"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^Include /etc/ssh/sshd_config.d/\*.conf'
        line: 'Include /etc/ssh/sshd_config.d/*.conf'
        insertbefore: BOF
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: "Enable ExposeAuthInfo in global config"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^ExposeAuthInfo'
        line: 'ExposeAuthInfo yes'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    # --- Loop Over Gateways ---
    
    - name: "Deploy Gateway Users"
      include_tasks: tasks/deploy_gateway.yml
      loop: "{{ gateways }}"
      loop_control:
        loop_var: gateway_user

  handlers:
    # Handlers run in definition order: a failed config test stops the
    # restart, so a broken drop-in can't take sshd down.
    - name: Validate sshd config
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      listen: Restart SSH

    - name: Restart sshd service
      ansible.builtin.service:
        name: "{{ sshd_service_name }}"
        state: restarted
      listen: Restart SSH
